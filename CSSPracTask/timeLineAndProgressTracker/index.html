<!DOCTYPE html>
<html>
<head>
    <title>Project Timeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Project Timeline</h1>

    <div class="timeline">

        <div class="event">
            <div class="circle">1</div>
            <div class="content">
                <h2>Planning</h2>
                <p>Project planning completed.</p>
                <span>Completed</span>
            </div>
        </div>

        <div class="event">
            <div class="circle">2</div>
            <div class="content">
                <h2>Design</h2>
                <p>Website design completed.</p>
                <span>Completed</span>
            </div>
        </div>

        <div class="event">
            <div class="circle">3</div>
            <div class="content">
                <h2>Development</h2>
                <p>Website development in progress.</p>
                <span>In Progress</span>
            </div>
        </div>

        <div class="event">
            <div class="circle">4</div>
            <div class="content">
                <h2>Testing</h2>
                <p>Testing the website.</p>
                <span>Upcoming</span>
            </div>
        </div>

        <div class="event">
            <div class="circle">5</div>
            <div class="content">
                <h2>Launch</h2>
                <p>Final website deployment.</p>
                <span>Upcoming</span>
            </div>
        </div>

    </div>

</body>
</html>
