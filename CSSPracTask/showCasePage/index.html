<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Shop<span>Easy</span></h2>
        <nav>
            <a href="#">Home</a>
            <a href="#products">Products</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <h1>Our Products</h1>

    <section class="products" id="products">

        <div class="product">
            <span class="badge">20% OFF</span>
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500">
            <h3>Headphones</h3>
            <p>₹1999 <del>₹2499</del></p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <span class="badge">NEW</span>
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500">
            <h3>Smart Watch</h3>
            <p>₹2999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <span class="badge">15% OFF</span>
            <img src="https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?w=500">
            <h3>Earbuds</h3>
            <p>₹1499 <del>₹1799</del></p>
            <button>Add to Cart</button>
        </div>

    </section>

</body>
</html>
