<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Choose Your Plan</h1>

    <div class="container">

        <div class="plan">
            <h2>Basic</h2>
            <h3>₹199/month</h3>
            <p>1 Project</p>
            <p>Basic Support</p>
            <p>5 GB Storage</p>
            <button>Choose Plan</button>
        </div>

        <div class="plan popular">
            <h2>Pro</h2>
            <h3>₹499/month</h3>
            <p>10 Projects</p>
            <p>Priority Support</p>
            <p>50 GB Storage</p>
            <button>Choose Plan</button>
        </div>

        <div class="plan">
            <h2>Premium</h2>
            <h3>₹999/month</h3>
            <p>Unlimited Projects</p>
            <p>24/7 Support</p>
            <p>Unlimited Storage</p>
            <button>Choose Plan</button>
        </div>

    </div>

</body>
</html>
