<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="#">Dashboard</a>
        <a href="#">Users</a>
        <a href="#">Products</a>
        <a href="#">Orders</a>
        <a href="#">Settings</a>
    </div>

    <div class="main">

        <h1>Dashboard Overview</h1>

        <div class="stats">

            <div class="box">
                <h3>Total Users</h3>
                <h2>1,250</h2>
            </div>

            <div class="box">
                <h3>Total Sales</h3>
                <h2>₹50,000</h2>
            </div>

            <div class="box">
                <h3>Orders</h3>
                <h2>350</h2>
            </div>

            <div class="box">
                <h3>Visitors</h3>
                <h2>5,600</h2>
            </div>

        </div>

        <div class="activity">
            <h2>Recent Activity</h2>

            <table>
                <tr>
                    <th>Name</th>
                    <th>Order</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>Rahul</td>
                    <td>#101</td>
                    <td>Completed</td>
                </tr>

                <tr>
                    <td>Priya</td>
                    <td>#102</td>
                    <td>Pending</td>
                </tr>

                <tr>
                    <td>Amit</td>
                    <td>#103</td>
                    <td>Completed</td>
                </tr>
            </table>
        </div>

    </div>

</body>
</html>
