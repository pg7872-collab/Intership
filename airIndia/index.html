<!DOCTYPE html>
<html>
<head>
    <title>Air India</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>✈ AIR INDIA</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#">Book Flight</a>
            <a href="#">Manage Booking</a>
