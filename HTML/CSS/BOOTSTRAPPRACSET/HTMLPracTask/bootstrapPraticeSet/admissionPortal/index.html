<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Admission Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Student Portal</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Admission</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="card admission-card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h3>Student Admission Form</h3>
        </div>

        <div class="card-body">
            <form>
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control mb-3" placeholder="Enter name" required>

                <label class="form-label">Email</label>
                <input type="email" class="form-control mb-3" placeholder="Enter email" required>

                <label class="form-label">Mobile Number</label>
                <div class="input-group mb-3">
                    <span class="input-group-text">+91</span>
                    <input type="tel" class="form-control" placeholder="Mobile number">
                </div>

                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control mb-3">

                <label class="form-label">Gender</label>
                <div class="mb-3">
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender" class="ms-3"> Female
                    <input type="radio" name="gender" class="ms-3"> Other
                </div>

                <label class="form-label">Select Course</label>
                <select class="form-select mb-3">
                    <option>Select Course</option>
                    <option>Computer Engineering</option>
                    <option>Mechanical Engineering</option>
                    <option>Civil Engineering</option>
                    <option>Electrical Engineering</option>
                </select>

                <label class="form-label">Address</label>
                <textarea class="form-control mb-3" rows="3"></textarea>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" required>
                    <label class="form-check-label">I agree to terms and conditions</label>
                </div>

                <button class="btn btn-primary" type="submit">Submit</button>
                <button class="btn btn-secondary" type="reset">Reset</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
