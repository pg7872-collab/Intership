<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Food<span>Zone</span></h2>

        <nav>
            <a href="#">Home</a>
            <a href="#menu">Menu</a>
            <a href="#offers">Offers</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome To FoodZone</h1>
        <p>Delicious Food For Everyone</p>
        <button>Order Now</button>
    </section>

    <section class="menu" id="menu">
        <h2>Our Special Menu</h2>

        <div class="items">
            <div class="food">
                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500">
                <h3>Pizza</h3>
                <p>₹199</p>
            </div>

            <div class="food">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500">
                <h3>Burger</h3>
                <p>₹99</p>
            </div>

            <div class="food">
                <img src="https://images.unsplash.com/photo-1547592180-85f173990554?w=500">
                <h3>Salad</h3>
                <p>₹149</p>
            </div>
        </div>
    </section>

    <section class="offer" id="offers">
        <h2>Special Offer: 20% OFF</h2>
        <p>Order today and enjoy delicious food!</p>
    </section>

    <footer id="contact">
        <p>© 2026 FoodZone Restaurant</p>
    </footer>

</body>
</html>
