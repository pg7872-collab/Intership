<!DOCTYPE html>
<html>
<head>
    <title>Hospital Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Hospital Appointment Booking</h1>
        <p>Book your doctor appointment online</p>

        <form>

            <label>Patient Name</label>
            <input type="text" placeholder="Enter patient name" required>

            <label>Age</label>
            <input type="number" placeholder="Enter age">

            <label>Gender</label>
            <select>
                <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Email Address</label>
            <input type="email" placeholder="Enter email">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number">

            <label>Select Department</label>
            <select>
                <option>Select Department</option>
                <option>Cardiology</option>
                <option>Neurology</option>
                <option>Orthopaedics</option>
                <option>Dermatology</option>
                <option>General Medicine</option>
            </select>

            <label>Select Doctor</label>
            <select>
                <option>Select Doctor</option>
                <option>Dr. Rahul Sharma</option>
                <option>Dr. Amit Patil</option>
                <option>Dr. Priya Singh</option>
            </select>

            <label>Appointment Date</label>
            <input type="date">

            <label>Symptoms</label>
            <textarea rows="3" placeholder="Enter your symptoms"></textarea>

            <label>Medical History</label>
            <textarea rows="3" placeholder="Enter medical history"></textarea>

            <button type="submit">Book Appointment</button>

        </form>

    </div>

</body>
</html>
