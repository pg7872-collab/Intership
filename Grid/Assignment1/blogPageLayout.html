<!DOCTYPE html>
<html>
<head>
    <title>Blog Page Layout</title>
    <link rel="stylesheet" href="blogPageLayout.css">
</head>
<body>

    <div class="container">

        <header>
            <h2>My Blog</h2>
        </header>

        <nav>
            <h3>Navigation</h3>
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </nav>

        <main>
            <h2>Main Content</h2>
            <p>Welcome to my blog page.</p>
            <p>This is the main content area.</p>
        </main>

        <aside>
            <h3>Sidebar</h3>
            <p>Recent Posts</p>
            <p>Categories</p>
        </aside>

        <footer>
            <p>Copyright 2026 My Blog</p>
        </footer>

    </div>

</body>
</html>
