<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="dashBoardLayout.css">
</head>
<body>

    <div class="container">

        <header>
            <h2>My Dashboard</h2>
        </header>

        <nav>
            <h3>Navigation</h3>
            <p>Home</p>
            <p>Dashboard</p>
            <p>Settings</p>
            <p>Profile</p>
        </nav>

        <main>
            <h2>Main Content</h2>
            <p>Welcome to Dashboard!</p>

            <div class="card">
                <h3>Total Users</h3>
                <p>150</p>
            </div>

            <div class="card">
                <h3>Total Orders</h3>
                <p>250</p>
            </div>
        </main>

        <aside>
            <h3>Sidebar</h3>
            <p>Notifications</p>
            <p>Recent Activity</p>
        </aside>

        <footer>
            <p>Copyright 2026 My Dashboard</p>
        </footer>

    </div>

</body>
</html>
