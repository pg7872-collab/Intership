
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="form2.css">
</head>
<body>

    <div class="main-container">

        <!-- Left Side -->
        <div class="left-side">

            <div class="instagram-logo">
                <div class="logo-circle">
                    <div class="logo-dot"></div>
                </div>
            </div>

            <h1>
                See everyday moments from<br>
                your <span>close friends</span>.
            </h1>

            <div class="photo-collage">
                <div class="photo photo-one">🌴</div>
                <div class="photo photo-two">👩🏻</div>
                <div class="photo photo-three">🌊</div>
                <div class="photo photo-four">👨🏽</div>
                <div class="photo photo-five">🌼</div>
                <div class="heart">💗</div>
                <div class="smile">💚</div>
            </div>

            <div class="app-store">App Store</div>

        </div>

        <div class="right-side">

            <form class="login-form">

                <h3>Log into Instagram</h3>

                <input
                    type="text"
                    placeholder="Mobile number, username or email"
                    required
                >

                <input
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="login-button">
                    Log in
                </button>

                <a href="#" class="forgot-password">
                    Forgot password?
                </a>

                <button type="button" class="facebook-button">
                    <span>f</span> Log in with Facebook
                </button>

                <button type="button" class="create-button">
                    Create new account
                </button>

            </form>

        </div>

    </div>

</body>
</html>
