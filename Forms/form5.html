<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="form5.css">
</head>
<body>

    <div class="container">

        <div class="welcome">
            <h1>Welcome Back!</h1>
            <p>Provide your personal details to use all features</p>
            <button class="signin">SIGN IN</button>
        </div>

        <div class="register">
            <h1>Register With</h1>

            <div class="social">
                <button>G+</button>
                <button>f</button>
                <button>◉</button>
                <button>in</button>
            </div>

            <h2>OR</h2>
            <p>Fill Out The Following Info For Registration</p>

            <form>
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>

                <button type="submit" class="signup">SIGN UP</button>
            </form>
        </div>

    </div>

</body>
</html>
