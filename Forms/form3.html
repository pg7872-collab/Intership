
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="form3.css">
</head>
<body>

    <div class="container">

        <h2>Registration</h2>

        <form>
            <h3>Personal Details</h3>

            <div class="details">
                <div class="input-box">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>

                <div class="input-box">
                    <label>Date of Birth</label>
                    <input type="text" placeholder="Enter birth date" required>
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="input-box">
                    <label>Mobile number</label>
                    <input type="tel" placeholder="Enter mobile number" required>
                </div>

                <div class="input-box">
                    <label>Gender</label>
                    <input type="text" placeholder="Enter your gender" required>
                </div>

                <div class="input-box">
                    <label>Occupation</label>
                    <input type="text" placeholder="Enter occupation" required>
                </div>
            </div>

            <h3>Identity Details</h3>

            <div class="details">
                <div class="input-box">
                    <label>ID Type</label>
                    <input type="text" placeholder="Enter ID type" required>
                </div>

                <div class="input-box">
                    <label>ID Number</label>
                    <input type="text" placeholder="Enter ID number" required>
                </div>

                <div class="input-box">
                    <label>Issue Authority</label>
                    <input type="text" placeholder="Enter issue department" required>
                </div>

                <div class="input-box">
                    <label>Issue Date</label>
                    <input type="text" placeholder="Enter ID issue date" required>
                </div>

                <div class="input-box">
                    <label>Issue State</label>
                    <input type="text" placeholder="Enter ID issue state" required>
                </div>

                <div class="input-box">
                    <label>Expiry Date</label>
                    <input type="text" placeholder="Enter ID expiry date" required>
                </div>
            </div>

            <button type="submit">Next &nbsp; ➜</button>

        </form>

    </div>

</body>
</html>
